<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff Portal Login - Corporate Management of Schools</title>
  <link rel="icon" href="/favicon.ico" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b2e59 0%, #144b8c 55%, #1d63b8 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .portal-titles {
      text-align: center;
      color: #ffffff;
      margin-bottom: 24px;
    }
    .portal-titles h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .portal-titles h2 {
      font-size: 1.1rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.88);
      margin: 0;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .login-card-header {
      text-align: center;
      padding: 28px 28px 12px;
      background: #ffffff;
    }
    .login-card-header img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .login-card-header h5 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .login-card-header p {
      font-size: 0.85rem;
      color: #64748b;
      margin: 0;
    }
    .login-card-body {
      padding: 20px 28px 28px;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-group-text {
      background-color: #f8fafc;
      border-color: #cbd5e1;
      color: #15549a;
    }
    .form-control {
      border-color: #cbd5e1;
      padding: 10px 12px;
      font-size: 0.92rem;
    }
    .form-control:focus {
      border-color: #15549a;
      box-shadow: 0 0 0 3px rgba(21, 84, 154, 0.12);
    }
    .btn-login {
      background: linear-gradient(135deg, #0d3b7a 0%, #1e62b5 100%);
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 11px;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #0a2e61 0%, #164f96 100%);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(13, 59, 122, 0.25);
    }
    .login-footer-links {
      text-align: center;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      margin-top: 18px;
      font-size: 0.82rem;
    }
    .login-footer-links a {
      color: #15549a;
      text-decoration: none;
      font-weight: 500;
    }
    .login-footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="portal-titles">
    <h1>Welcome to Corporate Management of Schools</h1>
    <h2>Archdiocese of Changanacherry &mdash; Staff Online Payment Portal</h2>
  </div>

  <div class="login-card">
    <div class="login-card-header">
      <img src="./staff-portal-logo.png" alt="Corporate Management Logo" onerror="this.style.display='none'" />
      <h5>Staff Login</h5>
      <p>Enter your credentials to access online invoice payments</p>
    </div>

    <div class="login-card-body">
      <div id="errorAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert">
        <i class="bi bi-exclamation-circle-fill me-1"></i>
        <span id="errorText">Invalid username or password.</span>
      </div>

      <form id="staffLoginForm" onsubmit="handleStaticLogin(event)" autocomplete="off">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Enter username"
              required
            />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Enter password"
              required
            />
            <button
              type="button"
              class="input-group-text bg-white"
              style="cursor: pointer;"
              onclick="togglePasswordVisibility()"
              title="Show/Hide Password"
            >
              <i id="eyeIcon" class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login to Portal
          </button>
        </div>
      </form>

      <div class="login-footer-links">
        <a href="./staff-portal.html#privacy">
          <i class="bi bi-shield-check me-1"></i>Privacy Policy
        </a>
      </div>
    </div>
  </div>

  <script>
    // Static credentials for bank verification & staff sample portal
    const VALID_CREDENTIALS = [
      { username: 'staff', password: 'staff@123', displayName: 'Thomas Mathew (Staff)' },
      { username: 'staff@archdiocese.org', password: 'staff@123', displayName: 'Thomas Mathew (Staff)' },
      { username: 'admin', password: 'admin@123', displayName: 'Thomas Mathew (Staff)' }
    ];

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.className = 'bi bi-eye-slash';
      } else {
        pwdInput.type = 'password';
        eyeIcon.className = 'bi bi-eye';
      }
    }

    function handleStaticLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById('username').value.trim().toLowerCase();
      const passVal = document.getElementById('password').value.trim();
      const errorAlert = document.getElementById('errorAlert');

      const matched = VALID_CREDENTIALS.find(
        c => c.username.toLowerCase() === userVal && c.password.toLowerCase() === passVal.toLowerCase()
      );

      if (matched) {
        errorAlert.classList.add('d-none');
        sessionStorage.setItem('staff_portal_auth', JSON.stringify({
          loggedIn: true,
          username: matched.username,
          displayName: matched.displayName,
          loginTime: new Date().toISOString()
        }));
        window.location.href = './staff-portal.html';
      } else {
        errorAlert.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
